# 每日文献推荐流水线（取代本地 cron：每天 06:00 run_daily.sh）
# GitHub Actions cron 只支持 UTC：22:00 UTC = 北京时间 06:00
name: daily-pipeline

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:  # 允许 Actions 页手动触发（首跑自动建 state 分支）

permissions:
  contents: write  # 需要 push main（feedback_data 回流）与强推 state 分支

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pull_state / push_state / feedback 回流需要完整远端信息

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 还原运行状态（state 分支）
        run: bash scripts/pull_state.sh

      - name: 节假日守卫
        id: holiday
        # --skip-weekends：周六/周日也跳过，周一自动合并补发 3 天（周报/月报不用此开关）
        run: |
          DAYS=$(python -m scheduler.holiday --skip-weekends)
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "回溯天数 DAYS=$DAYS（0 = 法定节假日或周末，当日整体跳过）"

      - name: 反馈收集与学习
        if: steps.holiday.outputs.days != '0'
        # 对应本地 run_daily.sh 的顺序执行语义：反馈失败（如 IMAP 临时不可用）不阻断推送
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python -m feedback

      - name: 每日推荐主流程
        if: steps.holiday.outputs.days != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          FEEDBACK_WEBHOOK_URL: ${{ secrets.FEEDBACK_WEBHOOK_URL }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
        run: python main.py --days "${{ steps.holiday.outputs.days }}"

      - name: 反馈数据回流 main
        if: steps.holiday.outputs.days != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback_data/
          if git diff --cached --quiet; then
            echo "feedback_data 无变更，跳过提交"
          else
            git commit -m "chore(feedback): 每日反馈数据回流"
            git pull --rebase origin main
            git push
          fi

      - name: 推送运行状态（state 分支）
        if: steps.holiday.outputs.days != '0'
        run: bash scripts/push_state.sh

      - name: 发布网页版报告（gh-pages 分支）
        # 隐含 success()：只在主流程成功后执行；hashFiles 确认有页面产出。
        # 失败会让 workflow 标红（便于人工重跑），不做 continue-on-error。
        if: steps.holiday.outputs.days != '0' && hashFiles('daily/**/*.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily        # 主流程写入 daily/<date>/<slug>.html
          destination_dir: daily      # 站点路径保持 /daily/<date>/<slug>.html
          keep_files: true            # 历史日期页面累积保留，不清理
          commit_message: "chore(pages): 每日网页版报告 run ${{ github.run_id }}"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
