# 每周情报报告（取代本地 cron：周一 07:53 run_weekly.sh）
# GitHub Actions cron 只支持 UTC：周日 23:53 UTC = 北京时间周一 07:53
name: weekly-pipeline

on:
  schedule:
    - cron: "53 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write  # 强推 state 分支

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pull_state / push_state 需要完整远端信息

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 还原运行状态（state 分支）
        run: bash scripts/pull_state.sh

      - name: 节假日守卫（法定节假日当周周报跳过，workflow 直接成功结束）
        id: holiday
        run: |
          DAYS=$(python -m scheduler.holiday)
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "DAYS=$DAYS（0 = 法定节假日，当周周报跳过）"

      - name: 每周情报报告
        if: steps.holiday.outputs.days != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python weekly_report.py

      - name: 推送运行状态（state 分支）
        if: steps.holiday.outputs.days != '0'
        run: bash scripts/push_state.sh

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
