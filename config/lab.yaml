# 实验室公共方向：对组内所有用户生效，与个人 yaml 的词表叠加参与打分
# topics 以 scoring.yaml 中 lab_topics 权重计分；同时并入全局检索词参与召回（V4 起）
#
# 批 14（2026-07-30）：按 lab_literature.exmple.txt（实验室实际关注文献清单）整体重构。
# 设计原则：实验室画像是"演化框架 × 组学方法"的交叉，词表只收自带演化/比较语境的
# 短语或主题专名；裸方法词/裸概念词（synteny、centromere、transposable element、
# sex determination、Tissue architecture 等）单独会命中海量非演化论文，全部删除或
# 改写为演化框架短语。物种专名只保留社会性昆虫锚点（示例文献直接相关）。
# 候选词均经 PubMed 90 天命中验证（logs/lab_term_verify_v2.json，logs 不入库）：
# 零命中虚词（AI biology、Generative biology 等臆造长尾）删除；热词（spatial
# transcriptomics 1282/90d）属实验室核心方法予以保留——lab 维度已梯度化
# （min(hits,4)*25，批 13），单词命中只 +25，不会单独饱和。
