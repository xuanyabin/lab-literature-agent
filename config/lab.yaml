# 实验室级别名表（同义词/拼写变体展开），与个人 aliases 合并时个人配置优先。
# 命中任一别名即算原 topic 命中（多变体不重复计分）；英美拼写、连字符变体放这里，
# 不要在 topics 里重复占位（会影响 lab 维度命中计数）。
aliases:
  honeybee: ["honey bee", "Apis mellifera"]
  division of labour: ["division of labor"]
  social insect: ["social insects"]
  insect society: ["insect societies"]
  cell phylogenies: ["cell phylogeny"]
  cell type evolution: ["evolution of cell types"]
  regulatory evolution: ["evolution of regulatory"]
  comparative single-cell: ["comparative single cell"]
  spatial multi-omics: ["spatial multiomics"]
  Stereo-seq: ["Stereo seq"]
  3D genome: ["three-dimensional genome"]
  pangenome: ["pan-genome"]
  whole genome duplication: ["whole-genome duplication"]
  cis-regulatory: ["cis regulatory"]
  evo-devo: ["evolutionary developmental biology"]
  telomere-to-telomere: ["T2T", "telomere to telomere"]
  sex chromosome turnover: ["sex-chromosome turnover"]
