# 实验室画像 · 全员研究方向（V5 全分组版）
# 维护逻辑：
#   - default_groups：全员自动订阅的组（旧 global_core 平铺列表的组化），召回时自动展开
#   - topic_groups：全部关键词按方向分组命名，便于按组维护与验证召回覆盖
#   - 个人画像（config/users/<id>.yaml）里 `topic_groups: [组名]` 可叠加订阅任意组
#   - 验证某组召回覆盖：.venv/bin/python scripts/audit_group_recall.py --group <组名>
#     （DEAD = 近 90 天零命中建议删词，HOT = 召回过多建议移入 rank_only）
# 组内词表改动时维护注释里的命中数（90 天 PubMed 宽查询）。
# 词表原始来源：批 14 全量词表（logs/lab_term_verify_v2.json，本文件为唯一入库版本）。
default_groups:
  - core_animal_origins
  - core_cell_type_evolution
  - core_comparative_genomics
  - core_regulatory_evolution
  - core_chromosome_evolution
  - core_sex_chromosomes

topic_groups:
  # ── 全员组（default_groups，即旧 global_core 的 62 词）──
  core_animal_origins:  # 动物起源与多细胞化
    - animal origins
    - origin of animals
    - Animal evolution
    - Evolutionary biology
    - evolution of multicellularity
    - multicellularity
    - choanoflagellate
    - evolutionary cell biology
    - animal cell types
    - animal complexity
    - cellular complexity
  core_cell_type_evolution:  # 细胞类型演化
    - cell type evolution
    - comparative single-cell
    - cell phylogenies
    - cell lineage evolution
    - cellular evolution
    - single-cell genomics
    - single-cell multiomics
    - comparative transcriptomics
  core_single_cell_atlas:  # 单细胞图谱
    - single-cell
    - Cell Atlas
    - brain cell atlas
  core_spatial_omics:  # 空间组学
    - spatially resolved transcriptomics
    - spatial multi-omics
    - spatial omics
    - spatial genomics
    - spatial biology
    - MERFISH
    - Stereo-seq
    - 3D genome
  core_comparative_genomics:  # 比较基因组学与系统发育基因组学
    - comparative genome
    - evolutionary genomics
    - phylogenomics
    - molecular evolution
    - pangenomics
    - genome architecture
    - Zoonomia
    - Earth BioGenome
    - gene family evolution
    - whole genome duplication
    - convergent evolution
    - adaptive radiation
    - population genomics
  core_regulatory_evolution:  # 调控演化
    - regulatory evolution
    - comparative epigenomics
    - evo-devo
    - chromatin evolution
    - non-coding genome
  core_chromosome_evolution:  # 染色体演化
    - telomere-to-telomere
    - chromosome evolution
    - chromosome rearrangement
    - chromosome fusion
    - supergene
  core_sex_chromosomes:  # 性染色体与性别决定
    - sex chromosome
    - sex chromosome turnover
    - sex-linked region
    - dosage compensation
    - temperature-dependent sex determination
    - parthenogenesis
  core_ai_models:  # AI 生物模型
    - protein structure prediction
    - language models for biology
    - Generative AI for biological

  # ── 订阅组（个人画像里按需订阅）──
  social_insects:  # 社会性昆虫（12 词）
    - eusociality
    - eusocial
    - social insects
    - social evolution
    - insect societies
    - caste determination
    - division of labor
    - Polistes
    - primitively eusocial
    - social polymorphism
    - ants
    - superorganism
  ant_phylogenomics:  # 蚂蚁系统发育/基因组方向，避免混入社会行为生态词
    - ant phylogenomics
    - ants
    - Formicidae
    - comparative genomics
    - evolutionary genomics
    - phylogenomics
    - genome evolution
    - population genomics
    - chromosome evolution
  genome_comparison:  # 基因组比较、组装评估与染色体结构工具
    - genome comparison
    - whole-genome comparison
    - comparative genomics
    - genome assembly
    - chromosome-scale
    - chromosome-level
    - synteny
    - synteny visualization
    - synteny analysis
    - BUSCO
    - orthology
    - orthologous gene
    - nucleotide alignment
    - structural variation
    - chromosome rearrangement
    - reference genome selection
    - centromere
    - karyotype evolution
    - chromosome fission
    - neo-chromosome
    - meiotic inheritance
  brain_evolution:  # 脑演化
    - brain evolution
    - brain complexity
    - neural cell types
    - nervous system evolution

# 组名 → 中文显示名（日报/周报/月报的模块分组标题与 badge 使用）。
# 缺省的组回退显示组名本身；新增 topic_groups 组时同步在此登记。
group_labels:
  core_animal_origins: 动物起源与多细胞化
  core_cell_type_evolution: 细胞类型演化
  core_single_cell_atlas: 单细胞图谱
  core_spatial_omics: 空间组学
  core_comparative_genomics: 比较基因组学与系统发育基因组学
  core_regulatory_evolution: 调控演化
  core_chromosome_evolution: 染色体演化
  core_sex_chromosomes: 性染色体与性别决定
  core_ai_models: AI 生物模型
  social_insects: 社会性昆虫
  ant_phylogenomics: 蚂蚁系统发育与基因组
  genome_comparison: 基因组比较
  brain_evolution: 脑演化

# 只打分不召回：高噪音词（实验室感兴趣，但独立检索噪音大）。
# 注释 = 近 90 天 PubMed 宽查询命中数（词表批 14 验证）。
rank_only:
  - EvoDevo                 # 432
  - Xenoturbella            # 56
  - social immunity         # 255
  - social behavior         # 22698
  - social hierarchy        # 2169
  - collective behavior     # 4666
  - aging                   # 23130
  - bird                    # 17542
  - comparative analysis    # 77952

# 医学噪音软惩罚（负分）：临床/医学期刊内容
noise_terms:
  - clinical trial
  - chemotherapy
  - immunotherapy
  - tumor microenvironment
  - patient cohort
  - radiology

# 精确词 → 召回宽词。个人画像里的 aliases 优先于这里。
aliases:
  multicellularity: ["evolution of multicellularity"]
  social insects: ["eusociality"]
  eusociality: ["social insects"]
  ants: ["social insects"]
  single-cell: ["single-cell genomics"]
  single cell: ["single-cell genomics"]
  spatial transcriptomics: ["spatial omics"]
  comparative genomics: ["comparative genome"]
  genome evolution: ["evolutionary genomics"]
  whole genome duplication: ["gene family evolution"]
  WGD: ["whole genome duplication"]
  sex chromosomes: ["sex chromosome"]
  social evolution: ["eusociality"]
  division of labor: ["social insects"]
  3D genome: ["spatial genomics"]
