# 模型配置：切换模型/调整参数只需修改本文件
provider: openai
model: gpt-5.4
temperature: 0.2
# 调用护栏：
#   timeout      单次请求超时秒数
#   max_tokens   单次最大输出 token
#   max_retries  可重试错误（429/连接错误/超时/5xx）的退避重试次数
#   daily_budget 每日 LLM 调用次数预算（跨进程累计，记录在 logs/.llm_usage.json，0 或负数 = 不限）
timeout: 60
max_tokens: 2000
max_retries: 3
daily_budget: 1000
