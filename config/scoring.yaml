# 规则粗筛打分权重（第 2 层）：调整推荐行为只需改这里，无需改代码
# 所有检索词等权：每命中一个检索词（原词或 aliases/自动扩展变体）加 1 分；
# 命中 exclude 词的论文直接淘汰；期刊影响力不在粗筛参与（由精排 journal 维度承担）
weights:
  species: 1            # 物种词（如 honeybee、Bombus）
  methods: 1            # 方法词（如 single-cell RNA sequencing）
  research_interest: 1  # 研究兴趣词
  keywords: 1           # 关键词
  # lab_topics 不参与粗筛打分（批 13）：全员共享词表等权计入会淹没个人词区分度、
  # 导致各用户候选趋同；它只在全局召回（global_pool）与精排 lab 维度生效

# tie-break 加分：提升同分候选的区分度
title_bonus: 1          # 检索词命中标题时额外加分
frequency_bonus: 1      # 同一检索词每多出现一次额外加分（按命中次数最多的变体计）
frequency_cap: 3        # 每个检索词的频次加分封顶

# Phase 4 个性化精排：六维权重（各维度 0-100，按权重加权平均为 Final Score）
ranker:
  weights:
    personal: 30   # 个人相关度（LLM 语义判断）
    lab: 20        # 实验室方向相关度
    journal: 30    # 期刊影响力（journals.yaml 分层；期刊因素只在此体现）
    novelty: 10    # 新颖性（LLM 语义判断）
    method: 10     # 方法相关度
    recency: 0     # 时效性（2026-07-29 起权重归零让位 personal；维度仍计算，调回即可恢复）
  # 重要性按 Final Score 绝对阈值定级（宁缺毋滥：当日全部低分则没有 Must Read）
  thresholds:
    must_read: 75  # Final Score ≥ 75 → Must Read
    important: 60  # Final Score ≥ 60 → Important；其余 Reference
    push_floor: 30 # Final Score < 30 的论文不进邮件（推送下限；删掉本行则全量推送）。
                   # 2026-07-29 随 recency 权重归零从 40 下调：不相关 T0 顶刊现为 journal 30 分（原 40），30 保持其露面机会
  # 精排批处理：一次 LLM 调用评判的论文数（≥1；批次之间按 model.yaml 的 max_workers 并发）
  batch_size: 5

# 顶刊直采通道（sources/top_journals.py）：绕过关键词召回，按 journals.yaml
# 刊名直抓最新论文并入全局池，解决顶刊漏召回（CNS 与实验室词表弱相关时进不了候选）
journal_channel:
  enabled: true        # 总开关
  tiers: [t0]          # 参与直采的分层（t0 / t1）
  max_per_user: 10     # 每用户每天最多额外进入精排的通道论文数（控制 LLM 成本）
  retmax_per_journal: 20  # 每刊每次最多抓取篇数

# Phase 5 反馈学习词表：由反馈闭环自动维护（与用户手配词表分离），改这里调行为
learned:
  promote_support: 2    # 同一新词需在 ≥N 篇高分标注论文中出现才提权（防漂移护栏）
  initial_weight: 1.0   # 新词提权时的初始权重
  boost: 0.5            # 每再多一篇高分支持论文的提权幅度
  max_weight: 3.0       # 单词权重上限
  negative_factor_weak: 0.5    # 弱负反馈（⭐2）命中学习词的权重乘数（只降权，不写 exclude）
  negative_factor_strong: 0.25 # 强负反馈（⭐1）的权重乘数；同词累计第 2 次 ⭐1 写 exclude_candidate 审计
  half_life_days: 30    # 词权重时间衰减半衰期（读取时计算，不回写）
  min_effective: 0.3    # 有效权重低于该值视为失效（不参与检索/打分）
  score_cap: 6          # 单篇论文 learned 词加分上限（避免压过手配词表）
