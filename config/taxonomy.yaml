# 两层展示分类法（4 大类 × 15 子类）
#
# 用途：日报/周报/月报的"大类分区 + 子类 badge"展示分类，由 LLM 在逐篇分析时判定
# （prompts/paper_analysis.txt），随分析缓存落库（paper_analysis.category/subcategory）。
#
# 维护约定：
# - 本文件只服务展示分类，与 lab.yaml 的召回订阅 topic_groups 无关，互不影响；
# - 增删/改名任何大类或子类时，必须同步 prompts/paper_analysis.txt 里的分类清单
#   （LLM 只能输出这里列出的 key）；
# - 大类顺序即渲染分区顺序；未分类论文归入"其他"分区沉底，不在此配置。
categories:
  genome_evolution_diversity:
    label_zh: 基因组演化与多样性
    subcategories:
      pangenomics: 泛基因组学
      comparative_genomics: 比较基因组学
      phylogenomics: 系统发育基因组学
      population_genomics: 群体基因组学
  cellular_spatial_biology:
    label_zh: 细胞与空间生物学
    subcategories:
      single_cell_atlas: 单细胞图谱
      spatial_omics: 空间组学
      spatiotemporal_3d_atlas: 三维时空图谱
      brain_atlas: 脑图谱
  animal_adaptation_physiology:
    label_zh: 动物适应与生理
    subcategories:
      high_altitude_hypoxia: 高原/低氧适应
      hibernation: 冬眠
      sleep_circadian: 睡眠/昼夜节律
      extreme_environment: 极端环境适应
  computational_biology:
    label_zh: 计算生物学
    subcategories:
      ai_biology: AI 生物学
      foundation_models: 基础模型
      bioinformatics_methods: 生物信息学方法
