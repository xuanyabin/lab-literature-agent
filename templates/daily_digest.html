<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日文献情报 · $date</title>
<style>
  body { margin: 0; padding: 0; background: #f4f5f7; font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; color: #24292f; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 10px; padding-left: 10px; border-left: 4px solid #1f6feb; }
  .hello { color: #57606a; font-size: 14px; margin: 0 0 8px; }
  .news-table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; }
  .news-table td { padding: 12px 14px; border-bottom: 1px solid #eaecef; vertical-align: top; font-size: 14px; }
  .news-table tr:last-child td { border-bottom: none; }
  .num { width: 28px; color: #1f6feb; font-weight: 600; }
  .title a { color: #0969da; text-decoration: none; font-weight: 600; }
  .news { margin-top: 6px; line-height: 1.7; }
  .meta { color: #57606a; font-size: 12px; margin-top: 6px; word-break: break-all; }
  .card { background: #ffffff; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.5; }
  .abstract { font-size: 13px; color: #3b434d; line-height: 1.7; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #d0d7de; }
  .footer { color: #8c959f; font-size: 12px; text-align: center; margin-top: 32px; }
  a { color: #0969da; }
</style>
</head>
<body>
  <div class="container">
    <h1>每日文献情报 · $date</h1>
    <p class="hello">$user_name，你好。今日为你筛选出 $count 篇最新论文，先用 30 秒浏览下方新闻摘要。</p>

    <h2>第一部分 · Research News Digest</h2>
    <table class="news-table">
$news_items
    </table>

    <h2>第二部分 · Paper Cards</h2>
$paper_cards

    <p class="footer">Lab Literature Intelligence System · 个性化推荐等级与推荐理由将在后续版本加入</p>
  </div>
</body>
</html>
