<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Literature Intelligence Report · $date</title>
<style>
  body { margin: 0; padding: 0; background: #f4f5f7; font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; color: #24292f; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 4px; padding-left: 10px; border-left: 4px solid #1f6feb; }
  .section-sub { color: #57606a; font-size: 12px; margin: 0 0 10px 14px; }
  .hello { color: #57606a; font-size: 14px; margin: 0 0 8px; }
  .overview { background: #ffffff; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #3b434d; line-height: 1.7; margin-top: 12px; }
  .row { background: #ffffff; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
  .row-title { font-size: 14px; font-weight: 600; line-height: 1.5; }
  .title-link { color: #0969da; text-decoration: none; }
  .news { margin-top: 6px; font-size: 13px; line-height: 1.7; }
  .meta { color: #57606a; font-size: 12px; margin-top: 6px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  .cat-must { background: #ffebe9; color: #cf222e; border: 1px solid #ff818266; }
  .cat-important { background: #fff8c5; color: #9a6700; border: 1px solid #d4a72c66; }
  .cat-reference { background: #ddf4ff; color: #0969da; border: 1px solid #54aeff66; }
  .cat-ignore { background: #f6f8fa; color: #57606a; border: 1px solid #d0d7de; }
  .web-btn-box { text-align: center; margin-top: 28px; }
  .web-btn { display: inline-block; background: #1f6feb; color: #ffffff; font-weight: 600; font-size: 15px; border-radius: 6px; padding: 12px 28px; text-decoration: none; }
  .footer { color: #8c959f; font-size: 12px; text-align: center; margin-top: 32px; }
  a { color: #0969da; }
</style>
</head>
<body>
  <div class="container">
    <h1>Daily Literature Intelligence Report · $date</h1>
    <p class="hello">$user_name，你好。今日为你筛选出 $count 篇论文，以下为一句话摘要列表；作者、摘要、推荐理由与五星反馈等完整内容请点击文末按钮查看网页版完整报告。</p>
$overview_block

    <h2>今日论文（$count 篇）</h2>
    <p class="section-sub">按推荐排序 · 点击标题查看原文，详情与反馈见网页版</p>
$paper_rows

    <div class="web-btn-box">
      <a class="web-btn" href="$web_url">展开详情 · 网页版完整报告</a>
    </div>

    <p class="footer">Lab Literature Intelligence System · 推荐等级由个性化评分引擎（六维加权）生成</p>
  </div>
</body>
</html>
